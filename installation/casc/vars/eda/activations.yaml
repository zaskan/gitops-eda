activations:
  - name: Payment HPA Rulebook Activation
    description: HPA Rulebook Activation for payment application
    project: "Ansible Gitops EDA Demo"
    rulebook: "hpa_rulebook.yaml"
    decision_environment: "EDA Decision Environment"
    enabled: true
    state: present
    org: "Default"
    awx_token: "Ansible Controller"
    credential: 
      - "Red Hat Ansible Automation Platform Credential"
  - name: Payment PVC Rulebook Activation
    description: Alertmanager Rulebook Activation for payment application
    project: "Ansible Gitops EDA Demo"
    rulebook: "pvc_rulebook.yaml"
    decision_environment: "EDA Decision Environment"
    enabled: true
    state: present
    org: "Default"
    awx_token: "Ansible Controller"
    credential: 
      - "Red Hat Ansible Automation Platform Credential"
