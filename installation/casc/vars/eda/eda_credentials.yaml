eda_credentials:
  - name: "Red Hat Ansible Automation Platform Credential"
    description: "Red Hat Ansible Automation Platform Credential"
    org: "Default"
    type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ aap_host }}/api/controller/"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"

  - name: "Quay Registry Credential"
    description: "Quay Registry Credential"
    org: "Default"
    type: "Container Registry"
    inputs:
      host: "quay.io"
      username: "{{ quay_username }}"
      password: "{{ quay_password }}"

  - name: "GLPI Credential"
    description: "GLPI REST API credential for EDA rulebooks"
    org: "Default"
    type: "GLPI"
    inputs:
      glpi_api_url: "{{ glpi_api_url }}"
      glpi_username: "{{ glpi_username }}"
      glpi_password: "{{ glpi_password }}"
      glpi_user_token: "{{ glpi_user_token }}"
      glpi_app_token: "{{ glpi_app_token }}"