glpi_api_url: "{{ lookup('ansible.builtin.env', 'GLPI_API_URL') }}"
glpi_username: "{{ lookup('ansible.builtin.env', 'GLPI_USERNAME') }}"
glpi_password: "{{ lookup('ansible.builtin.env', 'GLPI_PASSWORD') }}"
glpi_user_token: "{{ lookup('ansible.builtin.env', 'GLPI_USER_TOKEN', default='') }}"
glpi_app_token: "{{ lookup('ansible.builtin.env', 'GLPI_APP_TOKEN', default='') }}"

gitea_host: "https://gitea-{{ gitea.namespace }}.apps.{{ gitea.ocp_domain }}"
gitea_username: "gitea"
gitea_password: "openshift"

rhn_username: "{{ lookup('community.general.bitwarden_secrets_manager', '21d8d4ff-9191-402c-813a-b26c012837f3').value }}"
rhn_password: "{{ lookup('community.general.bitwarden_secrets_manager', '69b6ba85-0169-4c30-b524-b26c01285afd').value }}"
rhn_pool_id: "{{ lookup('community.general.bitwarden_secrets_manager', '4d4c5bf5-a9eb-4832-8a45-b26c01291c55').value }}"

quay_username: "{{ lookup('community.general.bitwarden_secrets_manager', '82f4b092-50fb-4138-bed9-b26e00ce0298').value }}"
quay_password: "{{ lookup('community.general.bitwarden_secrets_manager', '031b3102-55a9-4bf0-ba02-b26e00ce1a15').value }}"

# Argo CD (OpenShift GitOps): Route + cluster secret in openshift-gitops (uses kubeconfig from oc login).
argocd_host: "{{ (lookup('kubernetes.core.k8s', api_version='route.openshift.io/v1', kind='Route', namespace='openshift-gitops', resource_name='openshift-gitops-server', wantlist=True) | first).spec.host }}"
argocd_user: "admin"
argocd_password: "{{ (lookup('kubernetes.core.k8s', api_version='v1', kind='Secret', namespace='openshift-gitops', resource_name='openshift-gitops-cluster', wantlist=True) | first).data['admin.password'] | b64decode }}"

# OpenShift API: URL from Infrastructure; token from openshift-gitops Dex SA token secret (kubernetes.core.k8s). Adjust the name pattern if your GitOps install differs.
openshift_host: "{{ (lookup('kubernetes.core.k8s', api_version='config.openshift.io/v1', kind='Infrastructure', resource_name='cluster', wantlist=True) | first).status.apiServerURL }}"
openshift_token: "{{ (lookup('kubernetes.core.k8s', api_version='v1', kind='Secret', namespace='openshift-gitops', wantlist=True) | selectattr('type', 'equalto', 'kubernetes.io/service-account-token') | selectattr('metadata.name', 'match', '^argocd-dex-server-token-') | first).data.token | b64decode }}"