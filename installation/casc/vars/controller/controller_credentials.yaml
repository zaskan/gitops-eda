controller_credentials:
  - name: "Red Hat Ansible Automation Platform Credential"
    desc: "Red Hat Ansible Automation Platform Credential"
    org: "Default"
    type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ aap_host }}"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"

  - name: "Red Hat Event-Driven Ansible Credential"
    desc: "Red Hat Event-Driven Ansible Credential"
    org: "Default"
    type: "Red Hat Event-Driven Ansible"
    inputs:
      eda_host: "{{ controller_host }}"
      eda_user: "{{ aap_username }}"
      eda_pass: "{{ aap_password }}"

  - name: "ITSM App Credential"
    desc: "ITSM App API credentials (itsm-app)"
    org: "Default"
    type: "ITSM App"
    inputs:
      itsm_api_base_url: "{{ itsm.api_base_url }}"
      itsm_api_user: "{{ itsm.eda_user.username }}"
      itsm_api_password: "{{ itsm.eda_user.password }}"

  - name: "Gitea Credential"
    desc: "Gitea Credential"
    org: "Default"
    type: "Gitea"
    inputs:
      gitea_host: "{{ gitea_host }}"
      gitea_username: "{{ gitea_username }}"
      gitea_password: "{{ gitea_password }}"

  - name: "ArgoCD Credential"
    desc: "ArgoCD Credential"
    org: "{{ default_organization | default('Default') }}"
    type: "ArgoCD"
    inputs:
      argocd_host: "https://openshift-gitops-server-openshift-gitops.apps.{{ lookup('ansible.builtin.env', 'CLUSTER_DOMAIN') }}"
      argocd_user: "admin"
      argocd_pass: "{{ argoPass.stdout | b64decode }}"

  - name: "Openshift Credential"
    desc: "Openshift Credential"
    org: "{{ default_organization | default('Default') }}"
    type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_host }}"
      bearer_token: "{{ openshift_token }}"
