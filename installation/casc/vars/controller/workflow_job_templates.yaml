workflowjobtemplates:
  - name: "[WF] Autoscale Pipeline"
    org: "Default"
    ask_variables_on_launch: true
    allow_simultaneous: false
    steps:
      - identifier: Approve Production Changes
        unified_job_template:
          organization:
            name: Default
          name: "[JT] Autoscale Application"
          type: workflow_approval
        related:
          success_nodes:
            - identifier: Autoscale Application
      - identifier: "Autoscale Application"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Autoscale Application"
          type: job_template
        related:
          success_nodes:
            - identifier: "Synchronize Argocd"
      - identifier: "Synchronize Argocd"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Synchronize ArgoCD"
          type: job_template
        related:
          success_nodes:
            - identifier: "Update ITSM Ticket"
      - identifier: "Update ITSM Ticket"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Update ITSM Ticket"
          type: job_template

  - name: "[WF] Extend Openshift Physical Volume"
