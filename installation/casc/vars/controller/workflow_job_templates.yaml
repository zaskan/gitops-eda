workflowjobtemplates:
  - name: "[WF] Autoscale Pipeline"
    org: "Default"
    ask_variables_on_launch: true
    allow_simultaneous: false
    steps:
      - identifier: "Autoscale Application"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Autoscale Application"
          type: job_template
        related:
          success_nodes:
            - identifier: "Synchronize Argocd"
      - identifier: "Synchronize Argocd"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Synchronize ArgoCD"
          type: job_template
        related:
          success_nodes:
            - identifier: "Update GLPI Ticket"
      - identifier: "Update GLPI Ticket"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Update GLPI Ticket"
          type: job_template

