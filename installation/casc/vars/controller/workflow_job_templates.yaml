            - identifier: Extend Physical Volume
      - identifier: "Extend Physical Volume"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Extend Physical Volume"
          type: job_template
        related:
          success_nodes:
            - identifier: "Synchronize Argocd"
      - identifier: "Synchronize Argocd"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Synchronize ArgoCD"
          type: job_template
        related:
          success_nodes:
            - identifier: "Update ITSM Ticket"
      - identifier: "Update ITSM Ticket"
        unified_job_template:
          organization:
            name: "Default"
          name: "[JT] Update ITSM Ticket"
          type: job_template