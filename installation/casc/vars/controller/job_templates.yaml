jobtemplates:
  - name: "[JT] Open ITSM Ticket"
    org: "Default"
    inv: "Automation Controller Inventory"
    project: "Ansible Gitops EDA Demo"
    playbook: "open_ticket.yaml"
    creds:
      - "ITSM App Credential"
      - "Openshift Credential"
    use_fact_cache: false
    ask_limit_on_launch: false
    ask_variables_on_launch: true
    allow_simultaneous: false
    execution_environment: "Default execution environment"

  - name: "[JT] Update ITSM Ticket"
    org: "Default"
    inv: "Automation Controller Inventory"
    project: "Ansible Gitops EDA Demo"
    playbook: "update_ticket.yaml"
    creds:
      - "Red Hat Ansible Automation Platform Credential"
      - "ITSM App Credential"
    use_fact_cache: false
    ask_limit_on_launch: false
    ask_variables_on_launch: true
    allow_simultaneous: false
    execution_environment: "Default execution environment"

  - name: "[JT] Autoscale Application"
    org: "Default"
    inv: "Automation Controller Inventory"
    project: "Ansible Gitops EDA Demo"
    playbook: "autoscaler.yaml"
    creds: 
      - "Gitea Credential"
    use_fact_cache: false
    ask_limit_on_launch: false
    ask_variables_on_launch: true
    allow_simultaneous: false
    execution_environment: "Default execution environment"

  - name: "[JT] Extend Physical Volume"
    org: "Default"
    inv: "Automation Controller Inventory"
    project: "Ansible Gitops EDA Demo"
    playbook: "pvc.yaml"
    creds: 
      - "Gitea Credential"
    use_fact_cache: false
    ask_limit_on_launch: false
    ask_variables_on_launch: true
    allow_simultaneous: false
    execution_environment: "Default execution environment"

  - name: "[JT] Synchronize ArgoCD"
    org: "Default"
    inv: "Automation Controller Inventory"
    project: "Ansible Gitops EDA Demo"
    playbook: "sync_argocd.yaml"
    creds:
      - "ArgoCD Credential"
      - "Openshift Credential"
    use_fact_cache: false
    ask_limit_on_launch: false
    ask_variables_on_launch: false
    allow_simultaneous: false
    execution_environment: "Default execution environment"

  - name: "[JT] Reset Payment Application"
    org: "Default"
    inv: "Automation Controller Inventory"
    project: "Ansible Gitops EDA Demo"
    playbook: "reset.yaml"
    creds:
      - "Openshift Credential"
      - "Gitea Credential"
    use_fact_cache: false
    ask_limit_on_launch: false
    ask_variables_on_launch: false
    allow_simultaneous: false
    execution_environment: "Default execution environment"

