---
- name: Open ITSM incident
  hosts: localhost
  gather_facts: false
  tasks:

    - name: Create itsm-app incident (role tasks from incidents.yml only)
      ansible.builtin.include_role:
        name: demos.utils.itsm_ansible_role
        tasks_from: incidents.yml
      vars:
        itsm_incident_by_key: {}
        itsm_api_base_url: "{{ itsm_api_base_url | trim | regex_replace('/$', '') }}"
        itsm_api_user: "{{ itsm_api_user }}"
        itsm_api_password: "{{ itsm_api_password }}"
        itsm_validate_certs: false
        itsm_ansible_role_incidents: true
        itsm_incidents:
          - incident_key: "eda-{{ alert | default('alert') }}"
            title: "{{ title }}"
            description: "{{ description }}Check manifest: {{ manifest }}"
            severity: high

    - name: Record incident public id for downstream jobs
      ansible.builtin.set_stats:
        data:
          incident: "{{ itsm_incident_by_key['eda-' ~ (alert | default('alert'))] }}"

    - name: Silence Alarms
      kubernetes.core.k8s_exec:
        namespace: openshift-monitoring
        pod: alertmanager-main-0
        command: "amtool silence add --alertmanager.url http://localhost:9093  alertname={{ alert }} --comment 'ACK'"
